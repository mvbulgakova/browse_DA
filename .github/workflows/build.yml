name: Build InfoDa Browser APK
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'worker.js'
      - 'wrangler.toml'
      - 'web/**'
      - '.github/workflows/deploy-worker.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InfoDa.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfoDa-Browser-APK
          path: InfoDa.apk
      # Постоянная ссылка для телефона: .../releases/latest/download/InfoDa.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk InfoDa.apk --title "InfoDa ${{ github.run_number }}" --notes "Сборка ${{ github.run_number }} из ${{ github.sha }}" --latest
